<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Biodata</title>
</head>
<body>

<form action="form4.html" method="POST">

    <fieldset>
        <legend><h2>Formulir Peserta</h2></legend>

        <p>
            <label for="nama">Nama:</label>
            <input type="text" id="nama" name="nama"
            placeholder="Masukkan nama lengkap" required>
        </p>

        <p>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username"
            placeholder="Masukkan username" required>
        </p>

        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
            placeholder="Masukkan password" required>
        </p>

        <p>
            Jenis Kelamin:
            <input type="radio" name="jenkel" value="laki-laki" required>
            Laki-laki

            <input type="radio" name="jenkel" value="perempuan">
            Perempuan
        </p>

        <p>
            <label for="tanggal">Tanggal Lahir:</label>
            <input type="date" id="tanggal" name="tanggal" required>
        </p>

        <p>
            <label for="agama">Agama:</label>
            <select name="agama" id="agama" required>
                <option value="">Pilih Agama</option>
                <option value="budha">Budha</option>
                <option value="hindu">Hindu</option>
                <option value="islam">Islam</option>
                <option value="katholik">Kristen Katholik</option>
                <option value="protestan">Kristen Protestan</option>
            </select>
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
            placeholder="Masukkan email" required>
        </p>

        <p>
            Pilih Course:
            <input type="checkbox" name="course" value="web native">
            Web Native

            <input type="checkbox" name="course" value="web framework">
            Web Framework

            <input type="checkbox" name="course" value="mobile native">
            Mobile Native

            <input type="checkbox" name="course" value="mobile lintas platform">
            Mobile Lintas Platform
        </p>

        <p>
            <label for="alamat">Alamat:</label><br>
            <textarea id="alamat" name="alamat"
            cols="50" rows="5"></textarea>
        </p>

        <p>
            <input type="submit" value="Daftar">
        </p>

    </fieldset>

</form>

</body>
</html>
